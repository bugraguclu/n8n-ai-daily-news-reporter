services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.83
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.hisse-analizi.duckdns.org
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.hisse-analizi.duckdns.org/
      WEBHOOK_URL: https://n8n.hisse-analizi.duckdns.org/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      DB_SQLITE_POOL_SIZE: "2"
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dashboard
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  n8n_data:

networks:
  dashboard:
    external: true
    name: hisse-analizi-dashboard_default
